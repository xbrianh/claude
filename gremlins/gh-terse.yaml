name: gh-terse-no-copilot
default_client: claude:sonnet
base_ref: main
prompt_dir: prompts

prompts:
  code-style: gremlins:code_style.md
  terse: terse_no_backward.md
  verify: [gremlins:verify_fix.md, gremlins:bail_section_fix.md]

stages:
  - { name: plan,                  type: plan,                  prompt: [code-style, gremlins:plan_gh.md, terse] }
  - { name: implement,             type: implement,             prompt: [code-style, gremlins:implement_gh.md, terse] }
  - { name: verify,                type: verify,                options: { cmds: ["make check", "make -j4 test"] }, prompt: verify }
  - { name: open-pr,               type: github-open-pull-request }
  - name: reviews
    parallel:
      - { name: github-review-pull-request, type: github-review-pull-request, prompt: [code-style, gremlins:github_review_pull_request.md, terse] }
      - name: copilot_review
        type: sequence
        body:
          - { name: request-copilot, type: github-request-copilot-review }
          - { name: wait-copilot,    type: github-wait-copilot }
  - { name: github-address-pull-request-reviews, type: github-address-pull-request-reviews, prompt: [code-style, gremlins:github_address_pull_request_reviews.md, gremlins:bail_section.md, terse] }
  - { name: ci-gate,               type: github-wait-ci,        prompt: [gremlins:ci_fix.md, gremlins:bail_section_fix.md] }
